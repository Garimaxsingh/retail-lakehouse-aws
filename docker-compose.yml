# Local Airflow — orchestrates AWS Glue jobs via boto3, does not run any
# compute itself. Deliberately not MWAA (~$350/month, would exhaust the
# Free Plan credit budget in under three weeks — see docs/AWS_SETUP.md).
#
# Usage:
#   docker compose up airflow-init   # one-time: db migrate + create admin user
#   docker compose up -d             # start webserver + scheduler
#   # UI at http://localhost:8080 (admin/admin)
#   docker compose exec airflow-scheduler airflow dags trigger retail_lakehouse_backfill \
#     --conf '{"start_date": "2024-06-01", "end_date": "2024-06-07"}'
#
# Needs your AWS credentials available to the containers — either export
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY before `docker compose up`, or
# mount ~/.aws (uncommented below) if you use a credentials file instead.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AWS_DEFAULT_REGION: ap-south-1
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    _PIP_ADDITIONAL_REQUIREMENTS: boto3
  volumes:
    - ./dags:/opt/airflow/dags
    # - ~/.aws:/home/airflow/.aws:ro   # alternative to env-var credentials
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  postgres-db-volume:
